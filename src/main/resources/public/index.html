<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>That’s My Property</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:#f1f5f9;background:radial-gradient(circle at 20% 10%,#1e3a5f,#0b1220 70%);overflow:hidden}
.screen{display:none;height:100dvh;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.screen.on{display:flex}
#home{align-items:center;justify-content:center}
.card{background:#111c2fcc;border:1px solid #334155;border-radius:20px;padding:clamp(16px,4vh,32px);width:min(420px,92vw);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #0008;backdrop-filter:blur(8px)}
h1{font-size:clamp(26px,6vh,40px);text-align:center;letter-spacing:.5px}h1 span{color:#facc15}
.sub{text-align:center;color:#94a3b8;margin-bottom:4px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:#94a3b8;margin:4px 0 8px}
input,select{background:#0b1220;border:1px solid #334155;color:inherit;border-radius:10px;padding:11px 12px;font-size:16px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid #facc15;border-color:transparent}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;background:#334155;color:inherit;cursor:pointer;transition:transform .1s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.2)}button:active:not(:disabled){transform:scale(.96)}button:disabled{opacity:.4;cursor:default}
.chk{flex-direction:row;align-items:center;gap:10px}.chk input{width:auto}
.gear{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:2}
#settings{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:#000a}
.rdy{margin-left:auto;font-size:13px;color:#86efac;white-space:nowrap}.off{opacity:.5}
.tsh{font-size:15px;color:#0b1220;font-weight:900}
.pri{background:linear-gradient(135deg,#facc15,#f59e0b);color:#1a1200}
.ghost{background:#1e293b;padding:7px 12px;font-size:13px}
.row{display:flex;gap:8px}.row input{text-transform:uppercase}
#lobby{flex-direction:column;gap:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:22px;letter-spacing:4px;color:#facc15;margin:0 6px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.panel{background:#111c2fcc;border:1px solid #334155;border-radius:16px;padding:12px;overflow:auto;display:flex;flex-direction:column;min-height:0}
.pl{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;background:#0b122099;margin-bottom:6px;animation:pop .25s}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:24px;border:3px solid #0006;flex:none}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{width:46px;height:46px;font-size:24px;padding:0;border-radius:12px;background:#1e293b;border:2px solid transparent}
.chip.sel{border-color:#facc15;background:#3b3510}.chip.taken{opacity:.25;filter:grayscale(1)}
.dot{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid transparent}.dot.sel{border-color:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;font-size:14px;color:#cbd5e1}
.chat{gap:8px}#log{flex:1;overflow:auto;font-size:14px;display:flex;flex-direction:column;gap:4px;min-height:0}
#log b{color:#facc15}
#toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-80px);background:#ef4444;padding:10px 18px;border-radius:12px;transition:transform .25s;z-index:20;font-weight:600}
#toast.on{transform:translate(-50%,0)}
#rotate{display:none;position:fixed;inset:0;z-index:30;background:#0b1220;align-items:center;justify-content:center;text-align:center;font-size:20px}
#rotate div{font-size:56px}#rotate p{font-size:18px;margin-top:8px}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
@media (max-height:480px){main{gap:6px}.panel{padding:8px}.av{width:34px;height:34px;font-size:18px}.chip{width:38px;height:38px;font-size:20px}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
</style>
<link rel="stylesheet" href="game.css"></head><body>
<div id="rotate"><div><div>📱↻</div><p>Rotate your device to landscape</p></div></div>
<div id="toast"></div>

<section id="home" class="screen on"><button id="gearH" class="ghost gear" title="Settings">⚙</button><div class="card">
  <h1>That’s My <span>Property</span></h1><p class="sub">Hold it. Steal it. Keep it.</p>
  <input id="name" maxlength="12" placeholder="Username" autocomplete="off">
  <button id="create" class="pri">Host Room</button>
  <div class="row"><input id="code" maxlength="4" placeholder="CODE" autocomplete="off"><button id="join">Join Room</button></div>
</div></section>

<section id="lobby" class="screen">
  <header><div>Room<b id="rc"></b><button id="copy" class="ghost">Copy</button><button id="invite" class="ghost">Invite</button><button id="mus" class="ghost">🎵</button><button id="gearL" class="ghost" title="Settings">⚙</button></div><button id="leave" class="ghost">Leave</button></header>
  <main>
    <div class="panel"><h2>Players <span id="pc"></span></h2><div id="plist"></div><button id="ready" class="pri" style="margin-top:auto">I’m ready</button></div>
    <div class="panel">
      <h2>Character</h2><div id="chars" class="chips"></div>
      <h2>Team color</h2><div id="teams" class="chips"></div>
      <h2>Match</h2>
      <label class="field">Map<select id="map"><option value="forest">🌲 Forest</option><option value="desert">🏜️ Desert</option><option value="snow">❄️ Snow</option><option value="lava">🌋 Lava</option><option value="swamp">🍄 Swamp</option><option value="beach">🏖️ Beach</option><option value="candy">🍭 Candy Land</option><option value="space">🌑 Moon Base</option><option value="autumn">🍁 Autumn</option><option value="ruins">🏛️ Ancient Ruins</option></select></label>
      <label class="field">Mode<select id="mode"><option value="solo">Solo</option><option value="team">Team colors</option></select></label>
      <label class="field">Race to: <b id="tv"></b><input id="target" type="range" min="1" max="10"></label>
      <button id="addbot" class="ghost" style="margin-bottom:8px">🤖 Add bot</button>
      <button id="start" class="pri">Start Match</button>
    </div>
    <div class="panel chat"><h2>Chat</h2><div id="log"></div>
      <div class="row"><input id="msg" maxlength="120" placeholder="Say something" autocomplete="off"><button id="send">Send</button></div></div>
  </main>
</section>

<div id="settings"><div class="card"><h1 style="font-size:24px">Settings</h1>
  <label class="field">🎵 Lobby music volume<input id="sMusic" type="range" min="0" max="100"></label>
  <label class="field">🔊 Sound effects volume<input id="sSfx" type="range" min="0" max="100"></label>
  <label class="field chk"><input id="sMusicOn" type="checkbox"> Play lobby music</label>
  <label class="field chk"><input id="sShake" type="checkbox"> Screen shake</label>
  <label class="field chk"><input id="sVibe" type="checkbox"> Vibration (phones)</label>
  <button id="sClose" class="pri">Done</button></div></div>

<script>
const CH=['🐱','🐶','🦊','🐼','🐸','🐵','🐰','🐻','🐯','🦁','🐷','🐮','🐨','🐭','🐺','🦝','🐧','🐥','🦄','🤖'],
CHN=['Cat','Dog','Fox','Panda','Frog','Monkey','Bunny','Bear','Tiger','Lion','Pig','Cow','Koala','Mouse','Wolf','Raccoon','Penguin','Chick','Unicorn','Robot'],TEAMS={red:'#ef4444',blue:'#3b82f6',green:'#22c55e',yellow:'#eab308'},TSH={red:'●',blue:'■',green:'▲',yellow:'◆'};
const $=id=>document.getElementById(id);
let ws,S=null,lastAct=0,token=null,tries=0,rc=0;
try{token=sessionStorage.getItem('tmp_tok')}catch(e){}
function setTok(t){token=t;try{t?sessionStorage.setItem('tmp_tok',t):sessionStorage.removeItem('tmp_tok')}catch(e){}}
function clearTok(){setTok(null);rc=0}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));if(typeof Music!=='undefined')Music.want(id==='lobby')}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2600)}
function open(first){
  const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws=w;
  w.onopen=()=>{tries=0;w.send(first||JSON.stringify({t:'resume',token}))};
  w.onmessage=e=>on(JSON.parse(e.data));
  w.onclose=()=>{if(ws===w)lost()};
  w.onerror=()=>{if(!S&&!rc)toast('Cannot reach server')};
}
function go(m){
  if(rc)return; // reconnecting: nothing is sent until the seat is back
  const s=JSON.stringify(m);
  if(ws&&ws.readyState===1){ws.send(s);return}
  if(ws&&ws.readyState===0){ws.addEventListener('open',()=>ws.send(s),{once:true});return}
  open(s);
}
// the connection dropped: keep the screen and try to take the seat back (the server holds it for 15 seconds)
function lost(){
  if(S&&token){
    rc=1;
    if(++tries>8){clearTok();S=null;GameUI.stop();show('home');toast('Disconnected');return}
    if(tries===1)toast('Connection lost — reconnecting…');
    setTimeout(()=>{if(rc)open()},Math.min(1200*tries,3500));
  }else{rc=0;if(S){S=null;GameUI.stop();show('home');toast('Disconnected')}}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&token&&!rc&&(!ws||ws.readyState>1))lost()});
function on(m){
  if(m.t==='lobby'){const first=!S||GameUI.active;S=m;render();if(first){if(!GameUI.active)$('log').innerHTML='';GameUI.stop();show('lobby')}}
  else if(['init','round','state','ev','scores'].includes(m.t))GameUI.on(m);
  else if(m.t==='chat'){const d=document.createElement('div'),b=document.createElement('b');b.textContent=m.from+': ';d.append(b,m.text);const l=$('log');l.append(d);l.scrollTop=l.scrollHeight}
  else if(m.t==='welcome'){setTok(m.token);if(rc){rc=0;toast('Reconnected ✅')}}
  else if(m.t==='resumefail'){clearTok();S=null;GameUI.stop();show('home');toast(m.msg);if(ws)ws.close()}
  else if(m.t==='kicked'){clearTok();S=null;GameUI.stop();show('home');toast(m.msg)}
  else if(m.t==='error'){toast(m.msg);if(!S&&!rc&&ws)ws.close()}
}
function btn(cls,txt,fn){const b=document.createElement('button');b.className=cls;b.textContent=txt;b.onclick=fn;return b}
function render(){
  const me=S.players.find(p=>p.id===S.you),host=S.hostId===S.you,team=S.mode==='team';
  $('rc').textContent=S.code;$('pc').textContent=S.players.length+'/'+(S.max||15);
  const pl=$('plist');pl.innerHTML='';
  S.players.forEach(p=>{
    const d=document.createElement('div');d.className='pl'+(p.off?' off':'');
    const av=document.createElement('span');av.className='av';av.textContent=CH[p.character];av.style.background=team?TEAMS[p.team]:'#334155';
    const nm=document.createElement('span');nm.className='nm';nm.textContent=(team?TSH[p.team]+' ':'')+p.name+(p.bot?' 🤖':'')+(p.id===S.you?' (you)':'')+(p.id===S.hostId?' 👑':'')+(p.off?' (reconnecting…)':'');
    d.append(av,nm);
    if(p.ready&&!p.bot)d.append(Object.assign(document.createElement('span'),{className:'rdy',textContent:'✅ Ready'}));
    if(host&&p.id!==S.you)d.append(btn('ghost',p.bot?'Remove':'Kick',()=>go({t:'kick',id:p.id})));
    pl.append(d);
  });
  const ch=$('chars');ch.innerHTML='';
  CH.forEach((e,i)=>{const taken=S.players.some(p=>p.id!==S.you&&p.character===i);
    const b=btn('chip'+(me.character===i?' sel':'')+(taken?' taken':''),e,()=>go({t:'profile',character:i}));b.title=CHN[i]+(taken?' (taken)':'');b.disabled=taken;ch.append(b)});
  const tm=$('teams');tm.innerHTML='';
  Object.keys(TEAMS).forEach(k=>{const b=btn('dot'+(me.team===k?' sel':''),'',()=>go({t:'profile',team:k}));b.style.background=TEAMS[k];b.textContent=TSH[k];b.className+=' tsh';b.disabled=!team;tm.append(b)});
  $('map').value=S.map;$('mode').value=S.mode;$('target').value=S.target;$('tv').textContent=S.target;
  ['map','mode','target'].forEach(i=>$(i).disabled=!host);
  const nr=S.players.filter(p=>p.ready||p.bot).length;
  $('start').style.display=host?'':'none';$('start').textContent='Start Match ('+nr+'/'+S.players.length+' ready)';
  $('addbot').style.display=host?'':'none';$('addbot').disabled=S.players.length>=(S.max||15);
  $('ready').textContent=me.ready?'✅ Ready (tap to cancel)':'I’m ready';
}
const settings=()=>go({t:'settings',map:$('map').value,mode:$('mode').value,target:+$('target').value});
['map','mode','target'].forEach(i=>$(i).onchange=settings);
$('target').oninput=()=>$('tv').textContent=$('target').value;
$('create').onclick=()=>go({t:'create',name:$('name').value});
$('join').onclick=()=>go({t:'join',name:$('name').value,code:$('code').value});
$('ready').onclick=()=>go({t:'ready'});
$('addbot').onclick=()=>go({t:'addbot'});
$('invite').onclick=()=>{const url=location.origin+location.pathname+'?code='+S.code;
  if(navigator.share){navigator.share({title:'That’s My Property',text:'Join my room '+S.code,url}).catch(()=>{})}
  else{navigator.clipboard&&navigator.clipboard.writeText(url);toast('Invite link copied')}};
$('leave').onclick=()=>{go({t:'leave'});S=null;clearTok();if(ws)ws.close();show('home')};
{const c=new URLSearchParams(location.search).get('code');if(c)$('code').value=c.toUpperCase().slice(0,4)}
if(token){rc=1;open()} // page was refreshed: try to take the old seat back
$('start').onclick=()=>go({t:'start'});
$('copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(S.code);toast('Code copied')};
const sendChat=()=>{const v=$('msg').value.trim();if(v){go({t:'chat',text:v});$('msg').value=''}};
$('send').onclick=sendChat;$('msg').onkeydown=e=>{if(e.key==='Enter')sendChat()};
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{const n=Date.now();if(S&&n-lastAct>10000){lastAct=n;go({t:'active'})}}));
document.addEventListener('click',()=>{try{screen.orientation.lock('landscape')}catch(e){}},{once:true});
</script><script src="fx.js"></script>
<script src="game.js"></script>
</body></html>
