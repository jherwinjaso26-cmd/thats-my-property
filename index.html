<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>That's My Property</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0b0f19; font-family: sans-serif; }
        #game-canvas { width: 100%; height: 100%; display: block; }
        @media (orientation: portrait) {
            #portrait-warning { display: flex !important; }
        }
    </style>
</head>
<body class="select-none text-white">

    <div id="portrait-warning" class="hidden fixed inset-0 bg-slate-900 z-50 flex-col items-center justify-center p-6 text-center">
        <h2 class="text-2xl font-bold text-amber-400 mb-2">Rotate Your Device</h2>
        <p class="text-slate-300 text-sm">Please turn your device sideways to landscape mode to play the game.</p>
    </div>

    <div id="lobby-screen" class="absolute inset-0 z-40 bg-slate-950 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl max-w-lg w-full max-h-full overflow-y-auto shadow-2xl">
            <h1 class="text-3xl font-extrabold text-center tracking-wider text-cyan-400 mb-6 uppercase">That's My Property</h1>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Game Mode</label>
                    <select id="lobby-mode" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-cyan-500">
                        <option value="FFA">Free For All (2-4 Players)</option>
                        <option value="1V1">1v1 Showdown</option>
                        <option value="2V2">2v2 Team Mode</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Match Duration</label>
                        <select id="lobby-time" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-cyan-500">
                            <option value="180">3 Minutes</option>
                            <option value="60">1 Minute</option>
                            <option value="300">5 Minutes</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Target Score</label>
                        <select id="lobby-score" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-cyan-500">
                            <option value="5">5 Points</option>
                            <option value="3">3 Points</option>
                            <option value="10">10 Points</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Character Outfit Color</label>
                    <div class="flex gap-3 mt-1">
                        <button onclick="gameApp.setOutfit('#38bdf8')" class="w-8 h-8 rounded-full bg-cyan-400 border-2 border-white ring-2 ring-cyan-500"></button>
                        <button onclick="gameApp.setOutfit('#f43f5e')" class="w-8 h-8 rounded-full bg-rose-500 border-2 border-transparent hover:border-white"></button>
                        <button onclick="gameApp.setOutfit('#10b981')" class="w-8 h-8 rounded-full bg-emerald-500 border-2 border-transparent hover:border-white"></button>
                        <button onclick="gameApp.setOutfit('#a855f7')" class="w-8 h-8 rounded-full bg-purple-500 border-2 border-transparent hover:border-white"></button>
                    </div>
                </div>
            </div>

            <button onclick="gameApp.startGame()" class="w-full mt-6 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 px-4 rounded-lg uppercase tracking-wide transition-colors">Start Match</button>
        </div>
    </div>

    <div id="hud-overlay" class="hidden absolute inset-x-0 top-0 z-30 p-4 pointer-events-none flex justify-between items-start">
        <div class="bg-slate-900/80 border border-slate-700/50 backdrop-blur p-3 rounded-lg pointer-events-auto">
            <div class="text-xs uppercase tracking-wider text-slate-400">Your Identity</div>
            <div id="hud-player-tag" class="text-sm font-bold text-cyan-400">---</div>
            <div id="hud-player-score" class="text-xl font-black">Score: 0</div>
        </div>

        <div class="bg-slate-900/90 border border-slate-700/50 backdrop-blur px-6 py-2 rounded-full pointer-events-auto text-center">
            <div id="hud-round" class="text-xs font-bold uppercase tracking-widest text-amber-400">Round 1</div>
            <div id="hud-timer" class="text-2xl font-black tabular-nums tracking-wide text-white">03:00</div>
        </div>

        <div class="bg-slate-900/80 border border-slate-700/50 backdrop-blur p-3 rounded-lg pointer-events-auto text-right">
            <div class="text-xs uppercase tracking-wider text-slate-400">Target</div>
            <div id="hud-target-score" class="text-sm font-bold text-slate-200">First to 5</div>
            <div id="hud-mode" class="text-xs bg-slate-800 px-2 py-0.5 rounded mt-1 inline-block">FFA</div>
        </div>
    </div>

    <div id="alert-popup" class="hidden fixed inset-0 z-40 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-cyan-500 p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl scale-95 transition-transform duration-300">
            <div id="alert-title" class="text-2xl font-black uppercase tracking-wider text-cyan-400 mb-2">Event Triggered</div>
            <p id="alert-body" class="text-slate-300 text-sm mb-6">Action update required details here.</p>
            <button onclick="gameApp.dismissAlert()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2 px-6 rounded-lg uppercase text-xs tracking-wider transition-colors">Acknowledge</button>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script src="public/app.js"></script>
</body>
</html>
